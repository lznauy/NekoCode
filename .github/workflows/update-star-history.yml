name: Update Star History chart

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-star-history.yml'
      - 'scripts/update-star-history.mjs'
      - 'scripts/update-star-history.test.mjs'
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-star-history.yml'
      - 'scripts/update-star-history.mjs'
      - 'scripts/update-star-history.test.mjs'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: update-star-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Test chart generator
        run: node --test scripts/update-star-history.test.mjs

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.repository == 'lznauy/NekoCode'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify runner Node.js runtime
        run: node -e "if (Number(process.versions.node.split('.')[0]) < 18) process.exit(1)"
      - name: Generate chart assets
        env:
          STAR_HISTORY_GITHUB_TOKEN: ${{ github.token }}
          STAR_HISTORY_OUTPUT_DIR: ${{ runner.temp }}/star-history
        run: node scripts/update-star-history.mjs
      - name: Publish chart assets
        env:
          OUTPUT_DIR: ${{ runner.temp }}/star-history
          TARGET_BRANCH: star-history
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin "$TARGET_BRANCH"; then
            git switch --force-create "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git switch --orphan "$TARGET_BRANCH"
          fi

          mkdir -p assets/star-history
          cp "$OUTPUT_DIR/star-history-light.svg" assets/star-history/star-history-light.svg
          cp "$OUTPUT_DIR/star-history-dark.svg" assets/star-history/star-history-dark.svg
          # This branch contains chart assets, not the website. Vercel reads
          # config from the pushed branch, so master-only config cannot stop
          # these previews. Cover both repository-root and official-root projects.
          mkdir -p official
          node -e 'const fs = require("node:fs"); const config = JSON.stringify({git: {deploymentEnabled: false}}, null, 2) + "\n"; for (const path of ["vercel.json", "official/vercel.json"]) fs.writeFileSync(path, config);'
          git add assets/star-history vercel.json official/vercel.json

          if git diff --cached --quiet; then
            echo "Star History chart is already current."
            exit 0
          fi

          git commit -m "docs: update Star History chart"
          git push origin HEAD:"$TARGET_BRANCH"
