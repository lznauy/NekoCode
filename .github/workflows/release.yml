name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate release tag and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          core='(0|[1-9][0-9]*)'
          prerelease_id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          prerelease="${prerelease_id}(\.${prerelease_id})*"
          build='[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*'
          semver="^v${core}\.${core}\.${core}(-${prerelease})?(\+${build})?$"
          [[ "$RELEASE_TAG" =~ $semver ]] || {
            echo "Invalid semantic version tag: $RELEASE_TAG" >&2
            exit 1
          }
          tag_ref="refs/tags/$RELEASE_TAG"
          tag_object="$(git ls-remote origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          tag_target="$(git ls-remote origin "${tag_ref}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$tag_object" || -z "$tag_target" ]]; then
            echo "Release tag must be annotated: $RELEASE_TAG" >&2
            exit 1
          fi
          test "$tag_target" = "$(git rev-parse HEAD)" || {
            echo "Release tag does not point to the workflow commit: $RELEASE_TAG" >&2
            exit 1
          }
          prefix="## ${RELEASE_TAG} - "
          heading="$(grep -F -m1 -- "$prefix" docs/CHANGELOG.md || true)"
          release_date="${heading#"$prefix"}"
          [[ "$heading" == "${prefix}${release_date}" ]] || {
            echo "Missing changelog heading for $RELEASE_TAG" >&2
            exit 1
          }
          [[ "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "Invalid changelog date for $RELEASE_TAG: $release_date" >&2
            exit 1
          }

  validation:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    with:
      force_all: true

  build-linux:
    needs: validation
    strategy:
      matrix:
        include:
          - goarch: amd64
            zig_target: x86_64-linux-gnu
          - goarch: arm64
            zig_target: aarch64-linux-gnu

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Create zig CC wrapper
        run: |
          cat > /tmp/zigcc <<'EOF'
          #!/bin/sh
          exec zig cc -target ${{ matrix.zig_target }} "$@"
          EOF
          chmod +x /tmp/zigcc

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: /tmp/zigcc
          LD_FLAGS: -s -w -X 'nekocode/util/version.Version=${{ github.ref_name }}'
        run: |
          go build -trimpath -ldflags="$LD_FLAGS" -o "dist/nekocode-tui-linux-${GOARCH}" ./cmd/tui

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nekocode-tui-linux-${{ matrix.goarch }}
          path: dist/nekocode-tui-linux-${{ matrix.goarch }}
          retention-days: 7

  build-darwin:
    needs: validation
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          LD_FLAGS: -s -w -X 'nekocode/util/version.Version=${{ github.ref_name }}'
        run: |
          go build -trimpath -ldflags="$LD_FLAGS" -o "dist/nekocode-tui-darwin-${GOARCH}" ./cmd/tui

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nekocode-tui-darwin-${{ matrix.goarch }}
          path: dist/nekocode-tui-darwin-${{ matrix.goarch }}
          retention-days: 7

  release:
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: Assemble release files
        run: |
          mkdir -p release
          find dist -type f -name 'nekocode-tui-*' -exec cp {} release/ \;
          test "$(find release -type f -name 'nekocode-tui-*' | wc -l)" -eq 4

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release
          format: spdx-json
          output-file: release/sbom.spdx.json
          syft-version: v1.50.0
          upload-artifact: false

      - name: Create checksums
        run: |
          (cd release && sha256sum nekocode-tui-* sbom.spdx.json > SHA256SUMS)

      - name: Attest release files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
