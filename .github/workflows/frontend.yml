name: GUI frontend

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit validated for release, or the event default
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interaction/gui/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interaction/gui/web/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth xdotool
      - name: Build desktop application and verify embedded assets
        working-directory: .
        run: |
          make -f build/makefile gui
          # The binding test covers the root package. A single-file build omits its runtime methods.
          go version -m ./nekocode-gui | awk '$1 == "path" && $2 == "nekocode" { found = 1 } END { exit !found }'
          go test -tags=desktop,production,webkit2_41 -run '^TestGUIBindingsForwardImplementation$' .
          git diff --exit-code -- interaction/gui/web/dist
          test -z "$(git ls-files --others --exclude-standard -- interaction/gui/web/dist)"
      - name: Open the production window on a virtual display
        working-directory: .
        env:
          NEKOCODE_MODEL_CATALOG_OFFLINE: "1"
        run: |
          xvfb-run -a bash -ec '
            ./nekocode-gui &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            timeout 60 xdotool search --sync --all --onlyvisible --pid "$app_pid" --name "^NekoCode$"
          '
