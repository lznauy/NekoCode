name: Website

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit validated for release, or the event default
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: official
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: official/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
