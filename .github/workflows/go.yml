name: Go core

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit validated for release, or the event default
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Create portable Linux amd64 Zig CC wrapper
        run: |
          cat > /tmp/zigcc-linux-amd64 <<'EOF'
          #!/bin/sh
          exec zig cc -target x86_64-linux-gnu "$@"
          EOF
          chmod +x /tmp/zigcc-linux-amd64
      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Build
        run: CC=/tmp/zigcc-linux-amd64 go build ./...
      - name: Cross-compile Windows entry points
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: /tmp/zigcc-windows-amd64
        run: |
          cat > /tmp/zigcc-windows-amd64 <<'EOF'
          #!/bin/sh
          exec zig cc -target x86_64-windows-gnu "$@"
          EOF
          chmod +x /tmp/zigcc-windows-amd64
          go build ./headless ./acp ./cmd/headless ./cmd/daemon ./cmd/tui
      - name: Architecture boundaries
        run: go test ./internal/architecture
      - name: Test
        run: CC=/tmp/zigcc-linux-amd64 go test ./...
      - name: Test standalone evals Go module
        working-directory: evals
        run: CC=/tmp/zigcc-linux-amd64 go test -count=1 ./...
      - name: Install evaluator sandbox
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
      - name: Test offline evals
        working-directory: evals
        env:
          NEKOCODE_EVAL_BROWSER_TESTS: "0"
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "offline evals require Python 3.11+"'
          python3 -m unittest discover -s tests -v
      - name: Vet
        run: CC=/tmp/zigcc-linux-amd64 go vet ./...

      # Race detector: agent/contextmgr/runtime are the concurrency-dense core.
      # run separately so failures are attributed to races, not regular tests.
      - name: Race detector
        run: CC=/tmp/zigcc-linux-amd64 go test -race ./bot/... ./runtime/...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...
